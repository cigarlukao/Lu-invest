name: 自動更新股市儀表板

on:
  schedule:
    # 每天台灣時間下午 4:30（UTC 08:30）自動執行
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 允許您在 GitHub 網站上手動點擊執行

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出專案程式碼
        uses: actions/checkout@v4

      - name: 更新最後執行時間戳記
        run: |
          date -u "+%Y-%m-%d %H:%M:%S UTC" > last-update.txt

      - name: 自動提交並推送到 GitHub Pages
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "自動更新儀表板狀態 (自動化執行)" || exit 0
          git push
