name: 自動更新股市儀表板

on:
  schedule:
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出專案
        uses: actions/checkout@v4

      - name: 更新狀態檔
        run: |
          echo "Last updated on $(date)" > last-update.txt

      - name: 提交並推送更新
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "自動更新儀表板狀態 [skip ci]" || exit 0
          git push
